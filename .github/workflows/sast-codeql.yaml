
name: "SAST - CodeQL"

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ dev_main ]

  workflow_dispatch:
    inputs:
      branch_to_test:
        description: 'Branch or tag to run scan'
        required: true
        default: 'dev_main'
        type: string

  workflow_call:
    inputs:
      branch_to_test:
        description: 'Branch or tag to run scan'
        required: true
        default: 'dev_main'
        type: string

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: python
          build-mode: none
    steps:

    - name: Set branch variable
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "BRANCH=${{ github.event.pull_request.head.ref }}" >> "$GITHUB_ENV"
          echo "PR_NUM=#${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
        elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "BRANCH=${{ inputs.branch_to_test }}" >> "$GITHUB_ENV"
          echo "PR_NUM=#0" >> "$GITHUB_ENV"
        elif [[ "${{ github.event_name }}" == "push" ]]; then
          echo "BRANCH=${{ github.ref_name }}" >> "$GITHUB_ENV"
          echo "PR_NUM=" >> "$GITHUB_ENV"
        else
          echo "BRANCH=${{ github.ref_name }}" >> "$GITHUB_ENV"
          echo "PR_NUM=" >> "$GITHUB_ENV"
        fi

    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        ref: ${{ env.BRANCH }}
        submodules: recursive

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Perform CodeQL Analysis
      id: codeql_analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

    - name: Generate CodeQL Analysis Summary
      id: codeql_summary
      if: ${{ ! cancelled() }}
      run: |
        set +e
        source .ci/run-codeql-summ.sh
        exit_code=$?
        set -e        
        echo "CODEQL_SUMMARY=$CODEQL_SUMMARY" >> $GITHUB_ENV
        exit $exit_code
      env:
        GH_TOKEN: ${{ github.token }}
